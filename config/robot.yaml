# =============================================================================
# HX-1 hydraulic humanoid — SINGLE SOURCE OF TRUTH
# -----------------------------------------------------------------------------
# Every downstream artefact (CAD/STL, MuJoCo model, firmware config header,
# CAN protocol, wiring tables, print plan, QA thresholds) is generated from
# this file.  Edit here, then run `make all` (or `python -m hx design-loop`).
#
# Conventions
#   * SI units unless the key says otherwise (*_mm, *_deg, *_bar, *_g ...)
#   * World frame: x forward, y left, z up.  Zero pose = standing straight,
#     arms hanging, every body frame aligned with the world frame.
#   * Each body frame sits on the axis of the joint that moves it.
#   * Right-side limbs are generated by mirroring the left side (y -> -y);
#     roll/yaw ranges are mirrored automatically.
# =============================================================================

meta:
  name: HX-1
  version: 0.1.0
  mass_max_kg: 25.0
  description: >
    ~1.4 m, ~19 kg open-source humanoid with 14 low-pressure hydraulic joints
    (printed tie-rod cylinders, servo-actuated proportional spool valves) and
    10 servo joints. Structural parts are FDM printed on an Elegoo Neptune 4 Max.

# -----------------------------------------------------------------------------
printer:
  model: Elegoo Neptune 4 Max
  bed_x_mm: 420
  bed_y_mm: 420
  max_z_mm: 480
  edge_margin_mm: 8          # keep-out band around bed edge (clips / probe)
  part_spacing_mm: 6         # spacing between parts on a plate
  nozzle_mm: 0.4
  max_nozzle_c: 300
  max_bed_c: 85              # official N4 Max spec — limits ASA/PC choices
  nozzle_note: >
    Fibre-filled filaments (PA-CF, PETG-CF) require a hardened-steel nozzle
    compatible with the Neptune 4 hotend. Stock brass nozzle: PETG/TPU/PLA only.
  volumetric_flow_mm3_s: 14  # conservative average incl. travel, for time est.

materials:
  PETG:
    density_g_cm3: 1.27
    nozzle_c: 240
    bed_c: 75
    hardened_nozzle: false
    tensile_mpa: 48
    max_service_c: 70
    oil_compatible: true
  PA12-CF:
    density_g_cm3: 1.12
    nozzle_c: 280
    bed_c: 80
    hardened_nozzle: true
    tensile_mpa: 75
    max_service_c: 120
    oil_compatible: true
    note: Dry 8 h at 80 C before printing; print from a dry box.
  TPU95A:
    density_g_cm3: 1.21
    nozzle_c: 225
    bed_c: 50
    hardened_nozzle: false
    tensile_mpa: 30
    max_service_c: 60
    oil_compatible: true
  PLA:
    density_g_cm3: 1.24
    nozzle_c: 210
    bed_c: 60
    hardened_nozzle: false
    tensile_mpa: 50
    max_service_c: 50
    oil_compatible: false
    note: Fit-check prototypes only — never for loaded or pressurised parts.

print_profiles:          # wall_mm = perimeters * line width (0.45 mm)
  structural:   {layer_mm: 0.20, perimeters: 5, top_bottom: 6, infill: 0.35, pattern: gyroid}
  pressure:     {layer_mm: 0.16, perimeters: 8, top_bottom: 10, infill: 1.00, pattern: rectilinear}
  standard:     {layer_mm: 0.20, perimeters: 3, top_bottom: 4, infill: 0.20, pattern: gyroid}
  flexible:     {layer_mm: 0.20, perimeters: 3, top_bottom: 4, infill: 0.25, pattern: gyroid}

# -----------------------------------------------------------------------------
hardware:                 # standard purchased parts (dimensions in mm)
  bearing_608:   {id: 8,  od: 22, w: 7,  mass_g: 12}
  sph_bearing_ge8: {id: 8, od: 16, w: 8, mass_g: 8}   # GE8E spherical plain
  rod_end_m8:    {thread: M8, eye_id: 8, eye_w: 12, ball_od: 15, c2c_mm: 42, mass_g: 30}
  bolt_m8:       {d: 8.0, clearance: 8.4, head_d: 13, head_h: 8, nut_af: 13, nut_h: 6.5}
  bolt_m4:       {d: 4.0, clearance: 4.4, head_d: 7,  head_h: 4, nut_af: 7,  nut_h: 3.2}
  bolt_m3:       {d: 3.0, clearance: 3.4, head_d: 5.5, head_h: 3, nut_af: 5.5, nut_h: 2.4}
  insert_m3:     {hole_d: 4.0, depth: 5.7}             # brass heat-set insert
  insert_m4:     {hole_d: 5.6, depth: 8.1}
  magnet_6x2_5:  {d: 6.0, h: 2.5}                      # diametric, for AS5048A
  hydraulic_port: {thread: M5, insert_hole_d: 6.4, insert_depth: 8.0, passage_d: 2.5}
  bearing_6808:  {id: 40, od: 52, w: 7, mass_g: 26}        # hip-yaw thin-section bearing
  bearing_625:   {id: 5, od: 16, w: 5, mass_g: 5}          # servo-joint idlers
  oring_static:  {cord: 2.0, groove_w: 2.7, groove_depth: 1.5}
  oring_dynamic: {cord: 2.62, groove_w: 3.6, groove_depth: 2.1}

joint_hardware:           # printed joint interface (mm) - tune bearing_fit with fit coupon
  hub_r: 19.0
  tongue_w: 16.0
  gap: 1.0
  cheek_t: 10.0
  bearing_fit_d: 22.15    # 608 press-fit hole (printed); coupon tests 22.05/22.15/22.25
  lip_d: 15.0
  bolt_clear_d: 8.4
  bolt_tight_d: 8.0
  lug_t: 7.0
  lug_r: 11.0
  lug_gap: 13.5           # rod-end eye (12) + clearance

# -----------------------------------------------------------------------------
geometry:
  hip_spacing: 0.180        # between hip joint centres (y)
  hip_drop: 0.080           # pelvis frame -> hip roll axis (z down); room for yaw bearing + roll yoke
  hip_pitch_offset: 0.050   # hip roll axis -> hip pitch axis (non-intersecting hip: simple printable yokes)
  thigh_length: 0.300
  shin_length: 0.300
  ankle_roll_offset: 0.045  # ankle pitch axis -> ankle roll axis (foot tongue clears shin fork)
  ankle_height: 0.055       # ankle roll axis -> sole
  foot: {length: 0.230, width: 0.125, heel: 0.075, thickness: 0.022}
  torso: {height: 0.360, width: 0.150, depth: 0.190}  # pelvis frame -> shoulder axis
  shoulder_spacing: 0.340
  shoulder_yaw_drop: 0.085
  upper_arm_length: 0.240
  forearm_length: 0.220
  neck_height: 0.410        # pelvis frame -> neck yaw axis
  head: {size: [0.14, 0.13, 0.15]}
  link_radius: 0.026        # nominal keep-out radius of link beams (sizing)

# Initial mass guesses (kg) used for the first design-loop iteration only.
# Afterwards the loop replaces them with CAD-derived + hardware masses.
mass_guess:            # printed structure only (kg); hardware is added separately
  pelvis: 1.00
  torso: 2.50
  hip_yaw_link: 0.25
  hip_roll_link: 0.35
  thigh: 0.60
  shin: 0.50
  ankle_link: 0.15
  foot: 0.40
  shoulder_link: 0.25
  upper_arm_roll: 0.15
  upper_arm: 0.35
  forearm: 0.25
  hand: 0.20
  neck_link: 0.05
  head: 0.40

# Point masses of purchased equipment that live in the torso (kg, pos in pelvis frame)
torso_equipment:
  battery_6s_5ah_x2:      {mass: 1.50, pos: [-0.04, 0.0, 0.08]}
  hpu_motor_pump:         {mass: 1.25, pos: [-0.02, 0.0, 0.17]}
  accumulator_0p5l:       {mass: 0.85, pos: [-0.05, -0.04, 0.25]}
  reservoir_oil_0p6l:     {mass: 0.75, pos: [-0.05, 0.07, 0.25]}
  electronics_hub:        {mass: 0.45, pos: [0.06, 0.0, 0.22]}
  power_distribution:     {mass: 0.40, pos: [0.06, 0.0, 0.10]}

# -----------------------------------------------------------------------------
hydraulics:
  fluid:
    name: ISO VG 15 mineral hydraulic oil (NBR-compatible)
    density: 860.0
    bulk_modulus_pa: 1.4e+9
    effective_bulk_modulus_pa: 2.5e+8   # incl. nylon hose compliance and entrained air
  supply_pressure_bar: 15.0
  return_pressure_bar: 0.5
  relief_pressure_bar: 17.0
  proof_factor: 1.5                   # proof test = 1.5 x relief
  force_pressure_fraction: 0.80       # fraction of (Ps-Pt) usable for force (valve drop)
  hpu:
    pump_displacement_cc: 1.50      # QA HYD-4 sweep: 0.6 -> 9 bar, 1.2 -> 12.5 bar, 1.5 -> 13.4 bar min while walking
    pump_max_rpm: 6000
    pump_volumetric_eff: 0.85
    pump_overall_eff: 0.55
    pressure_band_bar: [13.5, 15.0]   # pump on below lo, off above hi
    accumulator_volume_l: 0.50
    accumulator_precharge_bar: 11.0
    reservoir_volume_l: 0.60
    max_oil_temp_c: 60
  valve:
    # Trade study (docs/02_hydraulics.md): 4x 2/2 solenoid bridges were rejected
    # (~0.40 kg/joint). Chosen: miniature servo-actuated proportional spool valve.
    type: miniature 4/3 closed-centre proportional spool valve, servo actuated (RC-hydraulics class)
    ports: G1/8 (M5 adaptors on the cylinder side)
    rated_pressure_bar: 30
    rated_flow_lpm: 6.0          # full spool at rated_dp; 3.0 saturated in SIL, 4.5 failed the QA flow margin
    rated_dp_bar: 10.0           # P->A + B->T total drop at rated flow
    overlap: 0.10                # closed-centre overlap, fraction of spool half-travel
    leakage_lpm: 0.03            # internal leakage at supply pressure, spool centred
    mass_g: 45
    servo:
      model: digital micro servo, metal gear, 0.06 s/60 deg @ 6 V
      pwm_hz: 333
      pulse_center_us: 1500
      pulse_span_us: 400         # +-400 us -> full spool travel
      time_const_ms: 12
      rate_full_travel_ms: 35
      mass_g: 25
      idle_a: 0.08
      peak_a: 0.9
  hose: {od_mm: 6, id_mm: 4, rated_bar: 40, material: PA12 nylon, ab_length_m: 0.35}
  sensor: {range_bar: 30, v_lo: 0.5, v_hi: 4.5, mass_g: 22}
  cylinder_catalog:
    # bore_mm: [rod_mm, tube_od_mm]   honed Al barrel + hardened chromed rod
    16: [6, 19]
    20: [8, 23]
    25: [10, 29]
    32: [12, 36]
    40: [12, 44]
  cylinder_construction:  # mm, used by both sizing (dead length) and CAD
    cap_thickness: 16
    piston_width: 14
    rod_thread_engagement: 12
    rod_end_c2c: 42          # rod-end (M8) eye centre to rod tip
    blind_lug: 22            # blind-cap face to lug centre
    stroke_round_mm: 5
    tie_rods: 4
    tie_rod: M3
    tube_density_g_cm3: 2.70
    rod_density_g_cm3: 7.85
  sizing:
    torque_safety_factor: 1.5     # capacity >= SF * demand at every sampled angle
    range_floor_fraction: 0.35    # capacity >= fraction * peak demand over FULL range
    min_moment_arm_mm: 12
    cyl_clearance_mm: 6           # cylinder envelope to joint centre / link keep-out
    velocity_margin: 1.25
    valve_flow_margin: 1.2       # valve flow at supply dp >= margin * peak joint flow

# -----------------------------------------------------------------------------
# Kinematic tree + actuation.  'side: LR' expands into L_ and R_ copies.
# origin is relative to the parent body frame (left side values).
# axis: x|y|z.  Ranges are for the LEFT side; mirrored for R where needed.
# hydraulic.anchors bounds are in the joint frame (parent & child coincide at q=0)
#   plane: which two coordinates span the cylinder plane; offset = coordinate
#   along the joint axis where the cylinder plane sits (+ = outboard for L).
# -----------------------------------------------------------------------------
bodies:
  - {name: pelvis, parent: world}
  - {name: torso, parent: pelvis, fixed: true, origin: [0, 0, 0]}

  - name: hip_yaw_link
    side: LR
    parent: pelvis
    origin: [0, 0.090, -0.080]
    joint: {name: hip_yaw, axis: z, range_deg: [-25, 25], mirror_range: true,
            actuator: {type: servo, model: HV-150kgcm}}
  - name: hip_roll_link
    side: LR
    parent: hip_yaw_link
    origin: [0, 0, 0]
    joint:
      name: hip_roll
      axis: x
      range_deg: [-15, 25]
      mirror_range: true
      actuator:
        type: hydraulic
        plane_offset: -0.085
        valve_on: parent
        anchors:
          parent: {u: [0.068, 0.095], v: [0.080, 0.150]}    # (y, z) in joint frame
          child:  {u: [0.065, 0.110], v: [-0.090, -0.020]}
  - name: thigh
    side: LR
    parent: hip_roll_link
    origin: [0, 0, -0.050]
    joint:
      name: hip_pitch
      axis: y
      range_deg: [-50, 30]
      actuator:
        type: hydraulic
        plane_offset: -0.058
        valve_on: parent
        anchors:
          parent: {u: [-0.170, -0.062], v: [-0.060, 0.070]}  # (x, z) behind & below the pelvis
          child:  {u: [-0.090, -0.010], v: [-0.220, -0.050]}
  - name: shin
    side: LR
    parent: thigh
    origin: [0, 0, -0.300]
    joint:
      name: knee
      axis: y
      range_deg: [0, 95]
      actuator:
        type: hydraulic
        plane_offset: 0.0
        valve_on: parent
        anchors:
          parent: {u: [0.040, 0.135], v: [0.110, 0.240]}
          child:  {u: [-0.040, 0.115], v: [-0.090, 0.045]}
  - name: ankle_link
    side: LR
    parent: shin
    origin: [0, 0, -0.300]
    joint:
      name: ankle_pitch
      axis: y
      range_deg: [-50, 40]
      actuator:
        type: hydraulic
        plane_offset: -0.052          # inboard, in front of the shin ("tibialis")
        valve_on: parent
        anchors:
          parent: {u: [0.035, 0.095], v: [0.120, 0.250]}
          child:  {u: [0.035, 0.095], v: [-0.020, 0.030]}
  - name: foot
    side: LR
    parent: ankle_link
    origin: [0, 0, -0.045]
    joint:
      name: ankle_roll
      axis: x
      range_deg: [-20, 20]
      mirror_range: true
      actuator:
        type: hydraulic
        plane_offset: -0.050          # behind the ankle, outboard
        valve_on: parent
        anchors:
          parent: {u: [0.045, 0.075], v: [0.110, 0.200]}    # yoke rises behind/outboard of the shin
          child:  {u: [0.045, 0.070], v: [-0.040, -0.010]}

  - name: shoulder_link
    side: LR
    parent: torso
    origin: [0, 0.170, 0.360]
    joint:
      name: shoulder_pitch
      axis: y
      range_deg: [-90, 45]
      actuator:
        type: hydraulic
        plane_offset: -0.057
        valve_on: parent
        anchors:
          parent: {u: [-0.090, 0.020], v: [-0.230, -0.090]}
          child:  {u: [0.030, 0.070], v: [-0.020, 0.040]}
  - name: upper_arm_roll
    side: LR
    parent: shoulder_link
    origin: [0, 0.060, 0]
    joint: {name: shoulder_roll, axis: x, range_deg: [0, 90], mirror_range: true,
            actuator: {type: servo, model: HV-60kgcm}}
  - name: upper_arm
    side: LR
    parent: upper_arm_roll
    origin: [0, 0, -0.085]
    joint: {name: shoulder_yaw, axis: z, range_deg: [-60, 60], mirror_range: true,
            actuator: {type: servo, model: HV-35kgcm}}
  - name: forearm
    side: LR
    parent: upper_arm
    origin: [0, 0, -0.195]
    joint:
      name: elbow
      axis: y
      range_deg: [-100, 0]
      actuator:
        type: hydraulic
        plane_offset: 0.062
        valve_on: parent
        anchors:
          parent: {u: [-0.080, 0.080], v: [0.040, 0.155]}
          child:  {u: [-0.060, 0.060], v: [-0.070, 0.030]}
  - name: hand
    side: LR
    parent: forearm
    origin: [0, 0, -0.220]
    joint: {name: gripper, axis: x, range_deg: [0, 60], sim: false,
            actuator: {type: servo, model: MG996R}}

  - name: neck_link
    parent: torso
    origin: [0, 0, 0.410]
    joint: {name: neck_yaw, axis: z, range_deg: [-80, 80], actuator: {type: servo, model: MG996R}}
  - name: head
    parent: neck_link
    origin: [0, 0, 0.030]
    joint: {name: neck_pitch, axis: y, range_deg: [-25, 30], actuator: {type: servo, model: MG996R}}

servo_models:      # stall torque (N m), no-load speed (rad/s), mass (kg), voltage
  HV-150kgcm: {stall_nm: 14.7, speed_rad_s: 3.5, mass: 0.200, volts: 7.4, stall_a: 8.0, idle_a: 0.25,
               body: [66.0, 30.0, 58.0], shaft_offset: 17.0, ear_span: 82.0, horn_d: 40.0}
  HV-60kgcm: {stall_nm: 5.9, speed_rad_s: 4.5, mass: 0.080, volts: 7.4, stall_a: 5.0, idle_a: 0.15,
              body: [40.5, 20.2, 38.0], shaft_offset: 10.0, ear_span: 54.0, horn_d: 25.0}
  HV-35kgcm: {stall_nm: 3.4, speed_rad_s: 6.0, mass: 0.070, volts: 7.4, stall_a: 3.5, idle_a: 0.10,
              body: [40.5, 20.2, 38.0], shaft_offset: 10.0, ear_span: 54.0, horn_d: 25.0}
  MG996R:    {stall_nm: 1.0, speed_rad_s: 5.2, mass: 0.055, volts: 6.0, stall_a: 2.5, idle_a: 0.10,
              body: [40.7, 19.7, 37.0], shaft_offset: 10.0, ear_span: 54.0, horn_d: 25.0}
servo_sizing:
  torque_utilisation_max: 0.50      # demand <= 50 % of stall

# -----------------------------------------------------------------------------
sim:
  timestep: 0.001
  control_hz: 1000
  standing_pelvis_height: 0.810     # slightly bent knees -> away from singularity
  payload_per_hand_kg: 1.0
  gait:
    step_length: 0.08
    step_width: 0.180
    step_time: 0.80
    double_support_fraction: 0.25
    swing_height: 0.035
    n_steps: 8
    preview_time: 1.6
  pd:     # simulation joint servo gains (idealised actuators used to find demand)
    kp: 900.0
    kd: 18.0
  squat_knee_deg: 75
  arm_lift_shoulder_deg: -87      # 3 deg inside the soft-limit band of the [-90, 45] range

# -----------------------------------------------------------------------------
control:                     # firmware joint-loop defaults (overridable per joint)
  loop_hz: 1000
  can_bitrate: 1000000
  heartbeat_timeout_ms: 50
  position_kp: 6.0           # (N m / rad) per unit of normalised inertia -> scaled per joint
  position_ki: 0.0
  position_kd: 0.25
  force_bandwidth_hz: 12     # force loop crossover; gains derived from chamber stiffness
  position_bandwidth_hz: 4.5 # POSITION-mode crossover
  impedance_stiffness_deg: 2.5  # peak demand torque produced at this position error
  max_following_error_deg: 12
  soft_limit_margin_deg: 3
  pressure_trip_bar: 18.5
  valve_deadband: 0.01        # command deadband beyond spool-overlap compensation

electrical:
  battery: {cells: 6, capacity_ah: 10.0, v_nom: 22.2, v_min: 19.8, v_max: 25.2, max_c: 20}
  rails:
    VALVE_6V:  {v: 6.0, source: buck_6v_15a, estop_switched: false}   # firmware centres (locks) spools on e-stop
    SERVO_7V4: {v: 7.4, source: buck_7v4_30a, estop_switched: true}
    LOGIC_5V:  {v: 5.0, source: buck_5v_6a, estop_switched: false}
    BRAIN_5V:  {v: 5.1, source: buck_5v_6a_pi, estop_switched: false}
    PUMP_BAT:  {v: 22.2, source: battery, estop_switched: true}
  nodes:
    - {name: leg_L, id: 1, kind: limb, joints: [L_hip_yaw, L_hip_roll, L_hip_pitch, L_knee, L_ankle_pitch, L_ankle_roll]}
    - {name: leg_R, id: 2, kind: limb, joints: [R_hip_yaw, R_hip_roll, R_hip_pitch, R_knee, R_ankle_pitch, R_ankle_roll]}
    - {name: arm_L, id: 3, kind: limb, joints: [L_shoulder_pitch, L_shoulder_roll, L_shoulder_yaw, L_elbow, L_gripper]}
    - {name: arm_R, id: 4, kind: limb, joints: [R_shoulder_pitch, R_shoulder_roll, R_shoulder_yaw, R_elbow, R_gripper]}
    - {name: hub,   id: 5, kind: hub,  joints: [neck_yaw, neck_pitch]}

# -----------------------------------------------------------------------------
qa:                          # acceptance thresholds used by the QA tree
  sil:
    max_overshoot: 0.15        # position step
    max_settle_s: 0.40         # 5 % band
    max_ss_err_deg: 0.6
    max_rms_err_deg: 1.5       # walk replay, impedance mode
    max_err_deg: 4.0           # walk/squat replay
    max_fault_detect_s: 0.05   # injected fault -> latched + valve locked
  sim:
    max_tilt_deg: 10
    max_final_com_error_m: 0.08
    max_tracking_err_deg: 5
  cad:
    interference_tol_mm3: 2.0
    min_lug_bearing_sf: 3.0    # printed lug bearing stress vs material tensile
  hpu:
    min_supply_margin_bar: 1.0 # min supply during scenarios must stay >= band_lo - 1.5 + margin
