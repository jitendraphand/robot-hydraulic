; HX-1 node firmware for ESP32-S3-DevKitC-1 (Arduino core on ESP-IDF).
; Same portable core (firmware/core) as the host unit tests and the Python SIL.
;
;   pio run -e leg_L -t upload        # flash the left-leg node
;   pio device monitor -e leg_L       # console: status | cal <j> | clear | faults

[platformio]
default_envs = leg_L, leg_R, arm_L, arm_R, hub

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -I../../core/include
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    symlink://../../core

[env:leg_L]
build_flags = ${env.build_flags} -DHX_NODE_ID=1

[env:leg_R]
build_flags = ${env.build_flags} -DHX_NODE_ID=2

[env:arm_L]
build_flags = ${env.build_flags} -DHX_NODE_ID=3

[env:arm_R]
build_flags = ${env.build_flags} -DHX_NODE_ID=4

[env:hub]
build_flags = ${env.build_flags} -DHX_NODE_ID=5 -DHX_HUB=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BNO08x@1.2.5
